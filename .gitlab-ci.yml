# =============================================================
# ⚙️ Pipeline Configuration
# =============================================================

include:
  - project: "cdp/cicd"
    ref: "2.0.2"
    file:
      - "jobs/SBOMsVulnerabilityScan.gitlab-ci.yml"
      - "jobs/KanikoBuildAndPush.gitlab-ci.yml"
      - "jobs/SkopeoDockerCopy.gitlab-ci.yml"
      - "jobs/HelmDeployLocalChart.gitlab-ci.yml"

stages:
  - "build"
  - "publish"
  - "scan"
  - "release"
  - "deploy"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
      variables:
        ENVIRONMENT: "prod"
    - when: "never"

variables:
  K8S_NAMESPACE: "lighthouse"
  TENANT: "global"
  TZ: "Europe/Berlin"
  BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.bun-cache"

# =============================================================
# 🧪 Build Application
# =============================================================

build:
  stage: "build"
  image: "oven/bun:1.4.0"
  tags:
    - "L2"
  cache:
    key:
      files:
        - "bun.lock"
        - "bunfig.toml"
    paths:
      - ".bun-cache/"
      - ".next/cache/"
    policy: "pull-push"
  script:
    - "bun install --frozen-lockfile"
    - "bun run lint"
    - "bun run typecheck"
    - "bun run test"
    - "bun run build"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# =============================================================
# 🔎 Scan Published Image
# =============================================================

vulnerability-scan:
  stage: "scan"
  extends: ".sboms-vulnerability-scan"
  needs:
    - job: "artifactory-publish"
      artifacts: true
  allow_failure: true
  rules:
    - if: "$CI_COMMIT_TAG"

dependency-audit:
  stage: "scan"
  image: "oven/bun:1.4.0"
  needs:
    - job: "build"
  script:
    - "bun audit"
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# =============================================================
# 📡 Publish Artifacts
# =============================================================

artifactory-publish:
  stage: "publish"
  extends: ".kaniko-build-and-push"
  tags:
    - "L2"
  variables:
    KANIKO_ENABLE_COMPRESSED_CACHING: "true"
    DOCKER_FILE_NAME: "Dockerfile"
    IMAGE_REGISTRY: "atp-docker-private-images.artifactory.rewe.local"
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
    IMAGE_TAG_LATEST: "false"
  parallel:
    matrix:
      - IMAGE_NAME: "twentysix-cubed"
        DOCKER_FILE_NAME: "Dockerfile"
      - IMAGE_NAME: "twentysix-cubed-migrate"
        DOCKER_FILE_NAME: "Dockerfile.migrate"
        DISABLE_SBOM_GENERATION: "true"
  rules:
    - if: "$CI_COMMIT_TAG"

# =============================================================
# 🏷️ Release Artifacts
# =============================================================

artifactory-release:
  stage: "release"
  extends: ".skopeo-docker-copy"
  variables:
    SRC_IMAGE_REGISTRY: "atp-docker-private-images.artifactory.rewe.local"
    SRC_IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
    DEST_IMAGE_REGISTRY: "atp-docker-private-images.artifactory.rewe.local"
    DEST_IMAGE_TAG: "$CI_COMMIT_TAG"
  parallel:
    matrix:
      - SRC_IMAGE_NAME: "twentysix-cubed"
        DEST_IMAGE_NAME: "twentysix-cubed"
      - SRC_IMAGE_NAME: "twentysix-cubed-migrate"
        DEST_IMAGE_NAME: "twentysix-cubed-migrate"
  rules:
    - if: "$CI_COMMIT_TAG"

gitlab-release:
  stage: "release"
  image: "cdp-docker-public-pipeline-images.artifactory.rewe.local/rewe-gitlab-release-cli:latest"
  needs:
    - job: "artifactory-release"
  script:
    - release-cli create --name "Version $CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description 'CHANGELOG.md'
  rules:
    - if: "$CI_COMMIT_TAG"

# =============================================================
# 🚀 Deploy Application
# =============================================================

deploy:
  stage: "deploy"
  extends: ".helm-deploy-chart"
  needs:
    - job: "artifactory-release"
    - job: "gitlab-release"
  environment:
    name: "prod/$TENANT"
  resource_group: "prod/$TENANT"
  variables:
    KUBECONFIG: "/home/pipeline/.kube/config"
    HELM_APP_VERSION: "$CI_COMMIT_TAG"
    HELM_CHART_RELATIVE_PATH: "helm"
    HELM_RELEASE_NAME: "twentysix-cubed"
    HELM_UPGRADE_ATOMIC: "true"
    HELM_VALUES_FILE: "helm/values.yaml helm/values-prod.yaml $SECRET_VALUES"
    HELM_TEMPLATE_EXTRA_ARGS: >-
      --set-string "image.tag=$CI_COMMIT_TAG"
      --set-string "migrations.image.tag=$CI_COMMIT_TAG"
    HELM_UPGRADE_EXTRA_ARGS: >-
      --set-string "image.tag=$CI_COMMIT_TAG"
      --set-string "migrations.image.tag=$CI_COMMIT_TAG"
  rules:
    - if: "$CI_COMMIT_TAG"
