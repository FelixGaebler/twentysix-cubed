{{- if or .Values.oidc.clientSecret .Values.oidc.sessionSecret }}
{{- if not .Values.oidc.enabled }}
{{- fail "oidc.enabled must be true when OIDC secrets are provided" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.oidc.existingSecret }}
  labels:
    {{- include "twentysix-cubed.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.oidc.clientSecretKey }}: {{ required "oidc.clientSecret is required when creating the OIDC Secret" .Values.oidc.clientSecret | quote }}
  {{ .Values.oidc.sessionSecretKey }}: {{ required "oidc.sessionSecret is required when creating the OIDC Secret" .Values.oidc.sessionSecret | quote }}
{{- end }}