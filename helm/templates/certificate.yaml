{{- if and .Values.issuer.enabled .Values.ingress.enabled .Values.ingress.tls -}}
{{- range $index, $tls := .Values.ingress.tls }}
{{- if $index }}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "twentysix-cubed.resourceName" (dict "root" $ "suffix" (printf "certificate-%d" $index)) }}
  labels:
    {{- include "twentysix-cubed.labels" $ | nindent 4 }}
spec:
  secretName: {{ $tls.secretName }}
  dnsNames:
    {{- range $tls.hosts }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    name: {{ include "twentysix-cubed.resourceName" (dict "root" $ "suffix" "issuer") }}
    kind: "Issuer"
    group: cert-manager.io
{{- end }}
{{- end }}
