{{- $databaseUrl := include "twentysix-cubed.databaseUrl" . | trim -}}
{{- if $databaseUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.existingSecret }}
  labels:
    {{- include "twentysix-cubed.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ $databaseUrl | quote }}
{{- end }}