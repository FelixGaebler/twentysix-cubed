{{- $hasOidcSecret := or .Values.oidc.clientSecret .Values.oidc.sessionSecret -}}
{{- if and $hasOidcSecret (not .Values.oidc.enabled) -}}
{{- fail "oidc.enabled must be true when OIDC secrets are provided" -}}
{{- end -}}
{{- if or .Values.database.url $hasOidcSecret -}}
{{- if not .Values.database.url -}}
{{- fail "database.url is required when Helm creates the shared application Secret" -}}
{{- end -}}
{{- if and .Values.oidc.enabled (not .Values.oidc.sessionSecret) -}}
{{- fail "oidc.sessionSecret is required when Helm creates the shared application Secret" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "twentysix-cubed.secretName" . }}
  labels:
    {{- include "twentysix-cubed.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ .Values.database.url | quote }}
  {{- if and .Values.oidc.enabled .Values.oidc.clientSecret }}
  {{ .Values.oidc.clientSecretKey }}: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- if .Values.oidc.enabled }}
  {{ .Values.oidc.sessionSecretKey }}: {{ .Values.oidc.sessionSecret | quote }}
  {{- end }}
{{- end }}